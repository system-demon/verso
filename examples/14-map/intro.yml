# Fragment: owns content only — no nav, no ordering, no head.
# { key: seed-name } resolves from the MAP's keys: block (keys cascade).
# The ld: block pins the section graph node to "#intro" — the same @id this
# fragment's assertions get whether it renders standalone or inside the map.

"@context": "https://schema.org"

div:
  class: "doc-topic"
  ld:
    "@id": "#intro"
    "@type": "TechArticle"
    headline: "Introduction"
  children:
    - h1: "Introduction"
    - p:
        children:
          - span: "Welcome to the "
          - strong: { text: { key: seed-name } }
          - span: " docs. This fragment is pulled into the map by include: and wrapped in a section."
    - p: "Maps own structure; fragments own content. The same YAML tree projects HTML and a CollectionPage knowledge graph."

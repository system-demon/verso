# 14 — map: composition documents
# A map owns publication STRUCTURE (order, nav, relations, pagination) while
# fragments own content. One structure, three projections: an HTML document,
# a nav tree, and a site-level knowledge graph (CollectionPage + hasPart).
#
#   node src/cli.js examples/14-map/site.map.yml          # fragment + JSON-LD
#   node src/cli.js examples/14-map/site.map.yml --doc    # full composed page
#   node src/cli.js examples/14-map/site.map.yml --json   # html + ldJson
#   node src/cli.js examples/14-map/site.map.yml --strict # validated
#
# Cascade: map-level keys: and the document @context merge into every
# fragment (the map wins name conflicts); head: does NOT cascade — only the
# map's own head: reaches --doc output.

"@context": "https://schema.org"

map:
  title: "WonderWidget Docs"
  ld: { "@type": CollectionPage }        # the publication node
  head:                                  # map-level head for --doc (does NOT cascade)
    title: "WonderWidget Docs"
    meta:
      description: "A three-topic docs publication composed from fragments"
    css:
      body: { fontFamily: "system-ui, sans-serif", margin: "2rem auto", maxWidth: "44rem" }
      "nav ul": { listStyle: "none", paddingLeft: "1.25rem" }
      section: { marginBottom: "2.5rem" }
      ".verso-related ul": { display: "flex", gap: "0.75rem", paddingLeft: "0" }
      ".verso-pager": { display: "flex", justifyContent: "space-between", borderTop: "1px solid #ddd", paddingTop: "0.75rem" }
  keys:
    product-name: "WonderWidget"         # cascades into all fragments
  items:
    - key: intro
      include: "intro.yml"               # relative to this map file
      nav: "Introduction"
    - key: pricing
      include: "pricing.yml"
      nav: "Pricing"
      items:                             # nesting = nested sections
        - key: tiers
          include: "tiers.yml"
          nav: "Tiers"
  relations:
    - [intro, pricing]                   # undirected related-links pair

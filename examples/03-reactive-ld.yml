# 03 — Reactive JSON-LD: graph properties reference presentational text
# Shows multiple @contexts (array: string + prefix map, preserved as-is)
# and an explicit @id giving the entity a stable graph node IRI.

"@context":
  - "https://schema.org"
  - kitchen: "https://example.org/kitchen#"

div:
  class: "recipe-card"
  id: "recipe_1"
  "@id": "https://example.org/recipes/skillet-eggs"

  ld:
    "@type": Recipe
    name: { ref: "#recipe_1 .name" }
    description: { ref: "#recipe_1 .description" }
    cookTime: { ref: "#recipe_1 .cookTime" }

  children:
    - h1:
        class: "name"
        text: "Skillet Eggs"
    - p:
        class: "description"
        text: "Fast breakfast with whatever is in the fridge."
    - span:
        class: "cookTime"
        text: "PT15M"
